plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.lspadskip'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.lspadskip"
        minSdk 21
        targetSdk 34
        // 独立包名，可与其它模块（如 Bili调速）共存、互不覆盖
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        // 模块会被其它进程加载，这类警告可忽略
        abortOnError false
    }
}

dependencies {
    // Xposed/LSPosed API 仅编译期引用，不会打入 APK
    compileOnly 'de.robv.android.xposed:api:82'
}
